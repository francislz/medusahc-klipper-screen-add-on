# MedusaHC KlipperScreen add-on settings
#
# Lives next to KlipperScreen.conf. The installer copies it once and never
# overwrites it, so edit it freely.

[medusahc]
# Preheat buttons on each tool card, in this order: comma-separated names of
# KlipperScreen preheat presets. Presets without an extruder temperature are
# skipped. Remove the line to show every preset.
preheat: PLA, ABS
