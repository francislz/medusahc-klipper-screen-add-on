# MedusaHC KlipperScreen add-on - menu entries
#
# Shown only on printers whose Klipper config has a medusahc section, so a
# KlipperScreen that controls several printers lists it only where it applies.
# Do not put text after a closing bracket on any line, comments included:
# KlipperScreen rejects such lines as broken section headers.

[menu __main medusahc]
name: MedusaHC
icon: toolchanger
panel: medusahc
enable: {{ 'medusahc' in printer.config_sections }}

[menu __print medusahc]
name: MedusaHC
icon: toolchanger
panel: medusahc
enable: {{ 'medusahc' in printer.config_sections }}
